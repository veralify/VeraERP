<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6366f1">
  <title>Money Manager · إدارة أموالك بذكاء</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("money-manager-theme")||"light"}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<a class="skip-link" href="#content">تخطَّ إلى المحتوى</a>

<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="القائمة الرئيسية">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">€</span>
      <span class="brand-text">
        <b>Money Manager</b>
        <small>إدارة أموالك بذكاء</small>
      </span>
      <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="إغلاق القائمة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <nav class="nav-scroll">
      <div class="nav-group">
        <p class="nav-group-title">نظرة عامة</p>
        <button class="nav active" data-page="dashboard" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>لوحة التحكم</span>
        </button>
      </div>

      <div class="nav-group">
        <p class="nav-group-title">الدخل والمصاريف</p>
        <button class="nav" data-page="income" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v9.5"/><path d="m8.4 10.2 3.6 3.6 3.6-3.6"/><path d="M4.5 18.5h15"/></svg>
          <span>مصادر الدخل</span>
        </button>
        <button class="nav" data-page="expenses" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3.5h13v17l-2.2-1.4-2.1 1.4-2.2-1.4-2.2 1.4-2.1-1.4-2.2 1.4z"/><path d="M9 8.5h6M9 12.5h6"/></svg>
          <span>المصاريف</span>
        </button>
        <button class="nav" data-page="transactions" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8.5h13"/><path d="m14 5.5 3 3-3 3"/><path d="M20 15.5H7"/><path d="m10 12.5-3 3 3 3"/></svg>
          <span>سجل المعاملات</span>
        </button>
        <button class="nav" data-page="subscriptions" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5A4.5 4.5 0 0 1 8 6h10"/><path d="m15 3 3 3-3 3"/><path d="M20.5 13.5A4.5 4.5 0 0 1 16 18H6"/><path d="m9 21-3-3 3-3"/></svg>
          <span>الاشتراكات</span>
        </button>
      </div>

      <div class="nav-group">
        <p class="nav-group-title">الديون والادخار</p>
        <button class="nav" data-page="debts" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19"/><path d="M6.5 14.8h4"/></svg>
          <span>الديون</span>
        </button>
        <button class="nav" data-page="plan" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10.5h18"/><path d="m9 15.5 2 2 4-4"/></svg>
          <span>خطة سداد الديون</span>
        </button>
        <button class="nav" data-page="savings" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="12" cy="12" r="3.4"/><path d="M12 6.8v1.8M6.5 19.5v1.2M17.5 19.5v1.2"/></svg>
          <span>المدخرات</span>
        </button>
      </div>

      <div class="nav-group">
        <p class="nav-group-title">السجلات</p>
        <button class="nav" data-page="admin-tasks" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5h6v3H9z"/><path d="M15 5h2.5A1.5 1.5 0 0 1 19 6.5v13a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19.5v-13A1.5 1.5 0 0 1 6.5 5H9"/><path d="m9.5 13 1.8 1.8 3.5-3.5"/></svg>
          <span>المهام والمواعيد</span>
        </button>
        <button class="nav" data-page="documents" type="button">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 16.5h4"/></svg>
          <span>الوثائق والإيصالات</span>
        </button>
      </div>
    </nav>

    <div class="sidebar-foot">
      <span class="dot-live" aria-hidden="true"></span>
      <div>
        <b>قاعدة بيانات محلية</b>
        <small>SQLite · نسخة أولى</small>
      </div>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-button menu-btn" id="menu-btn" type="button" aria-label="فتح القائمة" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="page-heading">
        <h1 id="title">لوحة التحكم</h1>
        <p id="subtitle">نظرة سريعة على وضعك المالي</p>
      </div>

      <div class="topbar-tools">
        <form class="search" id="search-form" role="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="search-input" type="search" placeholder="ابحث في المعاملات…" aria-label="ابحث في المعاملات">
        </form>

        <button class="btn primary topbar-add" id="topbar-add" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span id="topbar-add-label">إضافة</span>
        </button>

        <button class="icon-button" id="theme-toggle" type="button" aria-label="تبديل المظهر" title="تبديل المظهر">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13.4A8.2 8.2 0 0 1 10.6 4a8.4 8.4 0 1 0 9.4 9.4z"/></svg>
        </button>

        <span class="currency-chip" title="العملة">EUR €</span>
      </div>
    </header>

    <section id="content" class="content"></section>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button id="modal-close" class="icon-button" type="button" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
  <div class="modal-card modal-card--sm">
    <div class="modal-head">
      <h3 id="confirm-title">تأكيد الحذف</h3>
      <button id="confirm-close" class="icon-button" type="button" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="confirm-body">
      <span class="confirm-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8.5v5"/><path d="M12 17h.01"/><path d="M10.3 3.9 2.6 17.2A2 2 0 0 0 4.3 20h15.4a2 2 0 0 0 1.7-2.8L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      </span>
      <p id="confirm-text">هل أنت متأكد من حذف هذا العنصر؟ لا يمكن التراجع عن هذا الإجراء.</p>
    </div>
    <div class="form-actions">
      <button class="btn danger" id="confirm-accept" type="button">حذف نهائي</button>
      <button class="btn secondary" id="confirm-cancel" type="button">إلغاء</button>
    </div>
  </div>
</div>

<div class="toast-host" id="toast-host" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
