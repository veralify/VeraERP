name: Veralify

options:
  bundleIdPrefix: com.veralify
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO

packages:
  VeralifyCore:
    path: VeralifyCore
  # Sign-in and sync (docs/RECEIPTS_CONTRACTS.md). Pinned to 2.x: the 3.0 line
  # changes auth APIs the app uses.
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.55.0

targets:
  Veralify:
    type: application
    platform: iOS
    # A synced folder: Xcode compiles whatever is in Veralify/, so a new file
    # can never be left out of the build (and the project file stops listing
    # every file, so it no longer conflicts on each pull). Info.plist and the
    # entitlements are build settings, not resources.
    sources:
      - path: Veralify
        type: syncedFolder
        excludes:
          - App/Info.plist
          - App/Veralify.entitlements
    dependencies:
      - package: VeralifyCore
        product: VeralifyCore
      - package: Supabase
        product: Supabase
    # SUPABASE_URL and SUPABASE_ANON_KEY come from here (and the untracked
    # Backend.local.xcconfig it includes), never from source. See README.
    configFiles:
      Debug: Config/Backend.xcconfig
      Release: Config/Backend.xcconfig
    info:
      path: Veralify/App/Info.plist
      properties:
        SupabaseURL: $(SUPABASE_URL)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        # Return address for accounting sign-in (veralify://integrations).
        CFBundleURLTypes:
          - CFBundleURLName: com.veralify.moneymanager
            CFBundleURLSchemes:
              - veralify
    entitlements:
      path: Veralify/App/Veralify.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veralify.moneymanager
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Veralify
        INFOPLIST_KEY_NSCameraUsageDescription: "Veralify uses the camera to scan receipts and identity documents. Receipt photos are uploaded to your account to be read; identity documents are read on this device and never leave it."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  VeralifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VeralifyTests
    dependencies:
      - target: Veralify
      - package: VeralifyCore
        product: VeralifyCore

schemes:
  Veralify:
    build:
      targets:
        Veralify: all
        VeralifyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VeralifyTests
