name: Veralify

options:
  bundleIdPrefix: com.veralify
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO

packages:
  VeralifyCore:
    path: VeralifyCore

targets:
  Veralify:
    type: application
    platform: iOS
    sources:
      - path: Veralify
    dependencies:
      - package: VeralifyCore
        product: VeralifyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.veralify.moneymanager
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Veralify
        INFOPLIST_KEY_NSCameraUsageDescription: "Veralify uses the camera to scan a receipt or an identity document and read the details off it. The image is processed on your device and never leaves it."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  VeralifyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VeralifyTests
    dependencies:
      - target: Veralify
      - package: VeralifyCore
        product: VeralifyCore

schemes:
  Veralify:
    build:
      targets:
        Veralify: all
        VeralifyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VeralifyTests
